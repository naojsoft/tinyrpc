[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[tool.ruff]
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E265", "E266", "E402", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# The package's public surface is re-exported from its submodules.
"tinyrpc/__init__.py" = ["F403"]
